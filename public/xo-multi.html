<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>XO ULTRA</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#32215c,#100d22 65%);color:#f5efff;font:16px system-ui;display:grid;place-items:center}.wrap{width:min(94vw,430px);text-align:center}.badge{color:#c5a5ff;letter-spacing:3px}h1{font-size:30px;margin:12px}.players{display:flex;justify-content:space-between;background:#ffffff0b;border:1px solid #ffffff20;padding:15px;border-radius:18px}.players b{max-width:45%;overflow-wrap:anywhere}.status{padding:20px 0;min-height:64px;color:#e9d9ff}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#0806178a;padding:12px;border:1px solid #ffffff22;border-radius:22px}.cell{aspect-ratio:1;border:1px solid #594078;border-radius:16px;background:#ffffff09;color:#c8a5ff;font-size:clamp(32px,10vw,56px);font-weight:900;cursor:pointer}.cell.o{color:#ffcf6e}.cell:disabled{opacity:1;cursor:default}small{display:block;color:#b5a5ce;line-height:1.8;margin-top:16px}.error{color:#ffacb4}
</style></head><body><main class="wrap"><div class="badge">✦ XO ULTRA ✦</div><h1>مباراة لاعبين</h1><div class="players"><b id="x">❌ اللاعب الأول</b><b id="o">⭕ اللاعب الثاني</b></div><div id="status" class="status">جارٍ الاتصال…</div><button id="join" hidden style="border:0;background:#a78bfa;color:#130c25;padding:12px 35px;border-radius:12px;font-weight:800;margin-bottom:16px;cursor:pointer">انضمام وبدء المباراة</button><div id="board" class="board"></div><small>رابطك خاص بك؛ لا تشاركه مع أي شخص.<br>تتحدّث اللوحة تلقائياً.</small></main><script>
const token=location.hash.slice(1);const board=document.getElementById('board'),statusEl=document.getElementById('status');let current=null,busy=false,stopped=false;const joinButton=document.getElementById('join');
async function api(path,body){const res=await fetch(path,{method:body?'POST':'GET',headers:{'x-xo-token':token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error||'تعذر الاتصال');return data}
function draw(s){current=s;joinButton.hidden=!(s.status==='waiting'&&s.mark==='O');document.getElementById('x').textContent='❌ '+s.names[0];document.getElementById('o').textContent='⭕ '+s.names[1];statusEl.className='status';statusEl.textContent=s.status==='waiting'?'⏳ منتظر موافقة اللاعب الثاني':s.status==='rejected'?'رفض اللاعب الثاني الدعوة':s.status==='draw'?'🤝 انتهت بالتعادل':s.status==='finished'?(s.winner===s.mark?'🏆 مبروك فزت!':'انتهت المباراة'):s.turn===s.mark?'دورك الآن ✨':'⏳ دور اللاعب الآخر';board.replaceChildren();s.board.forEach((value,i)=>{const b=document.createElement('button');b.className='cell '+(value==='O'?'o':'');b.textContent=value==='X'?'✕':value==='O'?'◯':'';b.disabled=busy||s.status!=='active'||s.turn!==s.mark||!!value;b.setAttribute('aria-label','خانة '+(i+1));b.onclick=()=>move(i);board.append(b)})}
joinButton.onclick=async()=>{joinButton.disabled=true;try{draw(await api('/api/xo-multi/join',{}))}catch(e){statusEl.className='status error';statusEl.textContent=e.message}finally{joinButton.disabled=false}};
async function move(i){if(busy)return;busy=true;draw(current);try{draw(await api('/api/xo-multi/move',{position:i}))}catch(e){statusEl.className='status error';statusEl.textContent=e.message}finally{busy=false;if(current){board.querySelectorAll('button').forEach((b,i)=>{b.disabled=current.status!=='active'||current.turn!==current.mark||!!current.board[i]})}}}
async function poll(){if(stopped)return;try{draw(await api('/api/xo-multi/state'))}catch(e){statusEl.className='status error';statusEl.textContent=e.message;if(/انتهت اللعبة|غير صالح/.test(e.message))stopped=true}if(!stopped)setTimeout(poll,1800)}if(!token){statusEl.textContent='الرابط غير صالح';stopped=true}else poll();
</script></body></html>
