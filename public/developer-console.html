<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>لوحة المطوّر</title><style>
:root{color-scheme:dark;--bg:#090c17;--panel:#141a2b;--line:#ffffff13;--mut:#9ba9be;--accent:#a6ffde;--accent2:#977aff;--ink:#f1f5fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#292455 0,transparent 32%),radial-gradient(circle at 5% 35%,#133b3b 0,transparent 29%),var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.layout{max-width:1450px;margin:auto;min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{padding:28px 18px;border-left:1px solid var(--line);background:#0b0f1dcc;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;margin-bottom:35px;font-weight:800}.logo{background:linear-gradient(135deg,var(--accent),#69a7fa);color:#101527;border-radius:14px;width:44px;height:44px;display:grid;place-items:center;font-size:22px}.brand small{display:block;color:var(--mut);font-size:10px;letter-spacing:2px;direction:ltr}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#acb8cb;text-align:right;border-radius:11px;padding:12px 14px}.nav button.on{color:var(--accent);background:#a6ffde12}.sidefoot{position:absolute;bottom:25px;font-size:11px;color:#8192a9;line-height:1.8}.main{padding:30px clamp(16px,4vw,55px)}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.tag{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:bold}.top h1{font-size:clamp(25px,4vw,37px);margin:7px 0}.sub{color:var(--mut);font-size:13px}.badge{border:1px solid #a6ffde3c;color:var(--accent);padding:8px 12px;border-radius:99px;font-size:11px;white-space:nowrap}.hero{margin:24px 0 18px;border-radius:22px;padding:24px;background:linear-gradient(120deg,#203b43,#2c2851 75%,#15192b);border:1px solid #ffffff1b}.hero h2{margin:0 0 7px}.hero p{margin:0;color:#c0cfdb;font-size:13px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.card{background:linear-gradient(145deg,#1b2235,#131827);border:1px solid var(--line);border-radius:17px;padding:18px}.metric{font-size:26px;font-weight:800;margin:9px 0}.label,.note{font-size:12px;color:var(--mut);line-height:1.8}.stack{display:grid;gap:14px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.card h2,.card h3{margin:0 0 12px}.card label{display:block;color:#c7d3e3;font-size:12px;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #ffffff20;border-radius:10px;background:#090e1b;color:#edf4ff;padding:10px 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:#a6ffde8a}textarea{min-height:120px;resize:vertical;line-height:1.5}.code{direction:ltr;text-align:left;font-family:ui-monospace,monospace;min-height:280px;tab-size:2}button.primary{background:var(--accent);color:#111d25;border:0;border-radius:10px;padding:10px 16px;font-weight:800}button.secondary{background:#252e44;color:#e8f2ff;border:1px solid #ffffff14;border-radius:10px;padding:10px 14px}button:disabled{opacity:.5;cursor:wait}.list{display:grid;gap:7px;margin-top:10px}.list button{background:#ffffff07;border:1px solid #ffffff0b;color:#e2e9f4;border-radius:9px;padding:10px;text-align:right}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#080d19;color:#e2f4ed;border:1px solid var(--line);border-radius:12px;padding:15px;max-height:420px;overflow:auto;direction:auto;font-size:13px}.warn{color:#ffcf9f;font-size:12px}.hide{display:none!important}@media(max-width:700px){.layout{display:block}.side{height:auto;position:static;padding:14px;border-left:0;border-bottom:1px solid var(--line)}.brand{margin:0 0 14px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.main{padding:20px 14px}.badge{display:none}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><div class="logo">✦</div><div>مركز المطوّر<small>CONTROL STUDIO</small></div></div><nav class="nav" id="nav"><button data-page="home" class="on">◈ النظرة العامة</button><button data-page="users">♙ المستخدمون</button><button data-page="system">◉ النظام والعمال</button><button data-page="economy">◈ الاقتصاد والقنوات</button><button data-page="broadcast">✉ البث</button><button data-page="github">⌘ GitHub والملفات</button><button data-page="ai">✦ مساعد الكود</button><button data-page="texts">✎ نصوص البوت</button><button data-page="sites">◇ المواقع المؤقتة</button><button data-page="shell">▣ الشِل</button></nav><div class="sidefoot">جلسة خاصة مؤقتة<br>لا تشارك رابط الدخول</div></aside><main class="main"><header class="top"><div><div class="tag">DEVELOPER CONTROL STUDIO</div><h1 id="title">نظرة عامة</h1><div class="sub">كل أدواتك المهمة في مكان واحد، بهدوء ووضوح.</div></div><span class="badge">● جلسة آمنة مؤقتة</span></header><div id="view" class="stack"><div class="hero">جارٍ التحقق من الجلسة…</div></div></main></div><script src="/developer-console.js" defer></script></body></html>
