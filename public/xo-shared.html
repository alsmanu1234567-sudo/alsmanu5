<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>XO ULTRA</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#32215c,#100d22 65%);color:#f5efff;font:16px system-ui;display:grid;place-items:center}.wrap{width:min(94vw,430px);text-align:center}.badge{color:#c5a5ff;letter-spacing:3px}h1{font-size:30px;margin:12px}.players{display:flex;justify-content:space-around;background:#ffffff0b;border:1px solid #ffffff20;padding:15px;border-radius:18px}.status{padding:18px 0;min-height:60px}.play{border:0;background:#a78bfa;color:#130c25;padding:12px 35px;border-radius:12px;font-weight:800;margin-bottom:16px;cursor:pointer}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#0806178a;padding:12px;border:1px solid #ffffff22;border-radius:22px}.cell{aspect-ratio:1;border:1px solid #594078;border-radius:16px;background:#ffffff09;color:#c8a5ff;font-size:clamp(32px,10vw,56px);font-weight:900;cursor:pointer}.cell.o{color:#ffcf6e}.cell:disabled{opacity:1;cursor:default}small{display:block;color:#b5a5ce;line-height:1.8;margin-top:16px}.error{color:#ffacb4}</style></head><body><main class="wrap"><div class="badge">✦ XO ULTRA ✦</div><h1>مباراة لاعبين</h1><div class="players"><b>❌ اللاعب الأول</b><b>⭕ اللاعب الثاني</b></div><div id="status" class="status">جارٍ الاتصال…</div><button id="play" class="play" hidden>▶ لعب</button><div id="board" class="board"></div><small>أول شخصين يضغطان «لعب» يتنافسان.<br>تتحدّث اللوحة تلقائياً.</small></main><script>
const config=window.XO_SHARED_CONFIG||{base:'',id:location.hash.slice(1)}, id=config.id,base=config.base||'';let seat='',current=null,busy=false,stopped=false;
try{seat=localStorage.getItem('xo-shared:'+id)||''}catch{}const statusEl=document.getElementById('status'),board=document.getElementById('board'),play=document.getElementById('play');
async function api(path,body){const res=await fetch(base+path,{method:body?'POST':'GET',headers:{'x-xo-game':id,'x-xo-seat':seat,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error||'تعذر الاتصال');return data}
function draw(s){current=s;play.hidden=!!s.mark||s.status!=='waiting'||s.count>=2;statusEl.className='status';statusEl.textContent=s.status==='waiting'?(s.mark?'⏳ منتظر خصم':'اضغط لعب للانضمام'):s.status==='draw'?'🤝 تعادل':s.status==='finished'?(s.mark?(s.winner===s.mark?'🏆 مبروك فزت!':'انتهت المباراة'):'انتهت المباراة'):!s.mark?'المباراة جارية بين لاعبين':s.turn===s.mark?'دورك الآن ✨':'⏳ دور الخصم';board.replaceChildren();s.board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell '+(v==='O'?'o':'');b.textContent=v==='X'?'✕':v==='O'?'◯':'';b.disabled=busy||!s.mark||s.status!=='active'||s.turn!==s.mark||!!v;b.setAttribute('aria-label','خانة '+(i+1));b.onclick=()=>move(i);board.append(b)})}
play.onclick=async()=>{if(busy)return;busy=true;play.disabled=true;try{const s=await api('/api/xo-shared/join',{});seat=s.seat;try{localStorage.setItem('xo-shared:'+id,seat)}catch{}draw(s)}catch(e){statusEl.className='status error';statusEl.textContent=e.message}finally{busy=false;play.disabled=false}};
async function move(i){if(busy)return;busy=true;try{draw(await api('/api/xo-shared/move',{position:i}))}catch(e){statusEl.className='status error';statusEl.textContent=e.message}finally{busy=false}}
async function poll(){if(stopped)return;try{if(!busy)draw(await api('/api/xo-shared/state'))}catch(e){statusEl.className='status error';statusEl.textContent=e.message;if(/انتهت اللعبة|غير صالح/.test(e.message))stopped=true}if(!stopped)setTimeout(poll,1800)}if(!id){statusEl.textContent='الرابط غير صالح';stopped=true}else poll();
</script></body></html>
